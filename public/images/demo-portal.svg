<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 768" role="img" aria-labelledby="title desc">
  <title id="title">Tuiport live session portal</title>
  <desc id="desc">A luminous blue glass orb with a warm orange core floating over a terminal grid.</desc>
  <defs>
    <radialGradient id="sky" cx="50%" cy="30%" r="70%">
      <stop offset="0" stop-color="#173246"/>
      <stop offset=".55" stop-color="#0b1722"/>
      <stop offset="1" stop-color="#070b10"/>
    </radialGradient>
    <radialGradient id="orb" cx="35%" cy="25%" r="76%">
      <stop offset="0" stop-color="#f7fdff" stop-opacity=".96"/>
      <stop offset=".14" stop-color="#bdeeff" stop-opacity=".88"/>
      <stop offset=".46" stop-color="#2fa4cf" stop-opacity=".75"/>
      <stop offset=".72" stop-color="#176084" stop-opacity=".82"/>
      <stop offset="1" stop-color="#08243a" stop-opacity=".96"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff8c4"/>
      <stop offset=".28" stop-color="#f7b53b" stop-opacity=".96"/>
      <stop offset=".62" stop-color="#f6821f" stop-opacity=".68"/>
      <stop offset="1" stop-color="#f6821f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#15384d" stop-opacity=".42"/>
      <stop offset="1" stop-color="#071018" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="switch" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffd464"/>
      <stop offset=".45" stop-color="#f6821f"/>
      <stop offset="1" stop-color="#a3340a"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#71b8d8" stroke-opacity=".13"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="shadow" x="-60%" y="-60%" width="220%" height="240%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#02060a" flood-opacity=".76"/>
    </filter>
  </defs>
  <rect width="1280" height="768" fill="url(#sky)"/>
  <ellipse cx="640" cy="340" rx="330" ry="300" fill="#2678a4" opacity=".11" filter="url(#blur)"/>
  <path d="M0 512h1280v256H0z" fill="url(#floor)"/>
  <path d="M0 512h1280v256H0z" fill="url(#grid)" opacity=".78"/>
  <g opacity=".28" stroke="#71b8d8">
    <path d="M0 704h1280M0 640h1280M0 576h1280"/>
    <path d="m480 512-92 256m252-256v256m160-256 92 256"/>
  </g>
  <g filter="url(#shadow)">
    <circle cx="640" cy="306" r="166" fill="url(#orb)" stroke="#c8f4ff" stroke-opacity=".34" stroke-width="2"/>
    <circle cx="658" cy="328" r="105" fill="url(#core)" style="mix-blend-mode:screen"/>
    <path d="M532 260c37-76 121-108 195-73" fill="none" stroke="#fff" stroke-opacity=".67" stroke-width="18" stroke-linecap="round"/>
    <path d="M548 395c61 53 153 50 210-6" fill="none" stroke="#07131d" stroke-opacity=".32" stroke-width="12" stroke-linecap="round"/>
  </g>
  <ellipse cx="640" cy="535" rx="150" ry="34" fill="#f6821f" opacity=".16" filter="url(#blur)"/>
  <g filter="url(#shadow)">
    <path d="M520 528h240l-24 52H544z" fill="#0d1720" stroke="#465d6d"/>
    <path d="M544 528h192l-14 26H558z" fill="url(#switch)"/>
  </g>
  <g fill="#71b8d8" opacity=".32">
    <circle cx="322" cy="566" r="2"/><circle cx="368" cy="594" r="1.5"/><circle cx="918" cy="548" r="2"/><circle cx="972" cy="610" r="1.5"/><circle cx="1034" cy="570" r="1"/><circle cx="260" cy="622" r="1"/>
  </g>
</svg>
