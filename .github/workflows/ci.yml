name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache-dependency-path: relay/go.sum
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run public:check
      - run: bun run site:audit -- https://tuiport.coey.dev
      - run: cd relay && go test ./...
